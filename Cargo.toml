[package]
name = "mira"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform screenshot and screen recording, built with Native Shell"
repository = "https://github.com/chaxus/mira"
readme = "README.md"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
global-hotkey = "0.7"
parking_lot = "0.12"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }
xcap = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
xcap = "0.4"

[dev-dependencies]
tempfile = "3"

# Point crates.io NSH deps at the chaxus fork when you want fork-first builds:
#
# [patch.crates-io]
# nsh-core = { git = "https://github.com/chaxus/nsh" }
# nsh-base = { git = "https://github.com/chaxus/nsh" }
# nsh-platform-macos = { git = "https://github.com/chaxus/nsh" }
# nsh-platform-windows = { git = "https://github.com/chaxus/nsh" }
# nsh-platform-linux = { git = "https://github.com/chaxus/nsh" }
