[package]
name = "mira"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform screenshot and screen recording, built with Native Shell"
repository = "https://github.com/chaxus/mira"
readme = "README.md"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
global-hotkey = "0.7"
parking_lot = "0.12"
thiserror = "2"
tempfile = "3"
ab_glyph = "0.2"
rapidocr-core = { version = "0.2", default-features = false, features = ["model-download"] }
# rapidocr-core 0.2.2 expects Session::builder() without Environment (ort ≤ rc.12).
ort = { version = "=2.0.0-rc.12", default-features = true }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }
xcap = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
# ObjC ScreenCaptureKit bindings (avoid screencapturekit's Swift-bridge rpath issues).
cidre = { version = "0.29", default-features = false, features = [
    "sc",
    "blocks",
    "macos_15_0",
] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
xcap = "0.4"
windows-capture = "2.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Point crates.io NSH deps at the chaxus fork when you want fork-first builds:
#
# [patch.crates-io]
# nsh-core = { git = "https://github.com/chaxus/nsh" }
# nsh-base = { git = "https://github.com/chaxus/nsh" }
# nsh-platform-macos = { git = "https://github.com/chaxus/nsh" }
# nsh-platform-windows = { git = "https://github.com/chaxus/nsh" }
# nsh-platform-linux = { git = "https://github.com/chaxus/nsh" }
